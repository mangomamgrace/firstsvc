<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>늘푸른고등학교 구글 계정 검색</title>
  <link rel="stylesheet" href="./style.css" />
</head>


<body>
  <main class="container">
    <header class="header">
      <h1 class="title">늘푸른고등학교 구글 계정 검색</h1>
      <p class="desc">학번과 이름을 입력하면 해당 계정 정보를 조회합니다.</p>
    </header>

    <!-- 검색 폼 -->
    <section class="card">
      <h2 class="card-title">검색</h2>

      <!-- form을 쓰면 엔터로 제출(검색) 가능 -->
      <form id="searchForm" autocomplete="off">
        <div class="field">
          <label for="studentId">학번</label>
          <input
            id="studentId"
            name="studentId"
            type="text"
            inputmode="numeric"
            placeholder="예) 20250123"
            required
          />
        </div>

        <div class="field">
          <label for="studentName">이름</label>
          <input
            id="studentName"
            name="studentName"
            type="text"
            placeholder="예) 홍길동"
            required
          />
        </div>

        <button id="searchBtn" type="submit">검색</button>
      </form>

      <!-- 상태 메시지(로딩/오류 안내 등) -->
      <p id="statusMsg" role="status" aria-live="polite"></p>
    </section>

    <!-- 결과 영역 -->
    <section class="card">
      <h2 class="card-title">결과</h2>

      <!-- 기본은 숨김 처리하고, 검색 성공 시 JS에서 보여주도록 할 예정 -->
      <div id="resultBox" hidden>
        <div class="result-row">
          <span class="result-label">Google ID</span>
          <span id="resultId" class="result-value">-</span>
        </div>

        <div class="result-row">
          <span class="result-label">Password</span>
          <span id="resultPw" class="result-value">-</span>
        </div>
      </div>

      <!-- 검색 전 안내 문구 -->
      <p id="resultHint">학번과 이름을 입력하고 검색을 눌러주세요.</p>
    </section>

    <footer class="footer">
      <small>© 우리 학교</small>
    </footer>
  </main>

  <!-- 다음 단계에서 app.js를 만들고 연결할 거야 -->
  <script src="./app.js"></script>
</body>
</html>
